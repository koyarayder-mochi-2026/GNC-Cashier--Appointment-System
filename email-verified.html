<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b432d">
  <title>Email verification | GNC Student Cashier</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Oswald:wght@500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="assets/gnc-official-crest.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <section class="motto-band" aria-label="Guagua National Colleges motto">
    <div class="motto-inner">
      <div class="motto-item"><span class="motto-seal" aria-hidden="true"><span class="motto-cross">✣</span></span><span class="motto-copy"><strong>FIDES</strong><small>FAITH IN GOD AND ONE'S SELF.</small></span></div>
      <span class="motto-diamond" aria-hidden="true"></span>
      <div class="motto-item"><span class="motto-seal" aria-hidden="true"><svg viewBox="0 0 48 48"><path d="M7 11c7-3 12-1 17 3 5-4 10-6 17-3v25c-7-3-12-1-17 3-5-4-10-6-17-3z"/><path d="M24 14v25M11 16v16M37 16v16"/></svg></span><span class="motto-copy"><strong>SCIENTIA</strong><small>SEARCH FOR TRUTH AND KNOWLEDGE.</small></span></div>
      <span class="motto-diamond" aria-hidden="true"></span>
      <div class="motto-item"><span class="motto-seal" aria-hidden="true"><svg viewBox="0 0 48 48"><path d="M11 37c9-6 14-15 20-27 2 12-2 23-15 29z"/><path d="M16 35l-4 5M27 17l5 2"/></svg></span><span class="motto-copy"><strong>PATRIA</strong><small>LOVE FOR COUNTRY.</small></span></div>
    </div>
  </section>
  <main class="email-verified-page">
    <section class="email-verified-card" aria-live="polite">
      <img class="crest" src="assets/gnc-official-crest.png" alt="Guagua National Colleges official seal">
      <div id="verificationIcon" class="verified-check">✓</div>
      <p class="eyebrow">GNC STUDENT CASHIER PORTAL</p>
      <h1 id="verificationTitle">Confirming your email…</h1>
      <p id="verificationDescription">Please wait while Supabase confirms your student email address.</p>
      <a id="continueLoginLink" class="button button-primary" href="/?verified=1#authPanel" hidden>Continue to sign in →</a>
      <a class="secondary-link" href="index.html#home">Return to GNC homepage</a>
      <p id="verificationError" class="verification-state-error" hidden></p>
    </section>
  </main>
  <script src="config.js"></script>
  <script type="module" src="email-verified.js"></script>
</body>
</html>
